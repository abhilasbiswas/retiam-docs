name: Documentation Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      RETIAM_DOCS_DEPLOY: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate deployment configuration
        run: node --input-type=module -e "import { readDocsConfig } from './scripts/docs-config.mjs'; readDocsConfig();"
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Set documentation base
        env:
          DOCS_BASE: ${{ github.event_name == 'pull_request' && format('/{0}', github.event.repository.name) || steps.pages.outputs.base_path }}
        run: echo "RETIAM_DOCS_BASE_PATH=${DOCS_BASE:-/}" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Lint and test documentation
        run: |
          npm run lint
          npm test
      - name: Build documentation
        run: npm run build
      - name: Install browser for deployment checks
        run: npx --no-install puppeteer browsers install chrome
      - name: Verify static hosting
        run: npm run check:deployment
      - name: Verify engine CDN
        if: github.event_name != 'pull_request'
        env:
          RETIAM_DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run check:cdn
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
